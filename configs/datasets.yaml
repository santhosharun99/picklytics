# Roboflow Universe datasets used to train the ball detector.
# `version: latest` picks the newest dataset version; set a number to pin one.
# `class_map` maps each source class name (case-insensitive) to a target class.
# Source classes not listed are dropped.

target_classes: [ball]

datasets:
  - name: liberin_pickleball_vision
    workspace: liberin-technologies
    project: pickleball-vision
    version: latest
    class_map:
      ball: ball

  - name: uninu_pickleball
    workspace: pickleball-1uztf
    project: pickleball-uninu
    version: latest
    class_map:
      pickleball: ball

  - name: pbd_pickleball_bal_detection
    workspace: pickleball-ball-detector
    project: pickleball-bal-detection
    version: latest
    max_box: 0.06          # drop mislabelled huge "ball" boxes (fraction of image width/height)
    class_map:
      ball: ball
      pickleball - v5 2024-09-06 7-41am: ball   # the dataset's main ball class (odd export name)
