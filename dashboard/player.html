<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><link rel="icon" href="brand/picklytics-mark.png">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Player · Picklytics</title>
<link rel="stylesheet" href="theme.css?v=6">
<style>
.phead { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.av { flex: none; width: 56px; height: 56px; border-radius: 50%; background: var(--court-green); color: #fff; font-weight: 700; font-size: 20px; display: inline-flex; align-items: center; justify-content: center; }
.phead h1 { margin: 0; font-size: 26px; letter-spacing: -.015em; color: var(--paddle); overflow-wrap: anywhere; }
.phead .meta { color: var(--text-secondary); font-size: 14px; }
.pscope { margin-top: 12px; font-size: 13.5px; color: var(--text-secondary); background: var(--surface-1); border: 1px solid var(--border); border-left: 4px solid var(--ball); border-radius: 8px; padding: 10px 14px; }
.fmtsec { margin-top: 26px; }
.fmtsec > h2 { margin: 0 0 4px; font-size: 19px; color: var(--paddle); display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.fmtsec > .sub { margin: 0 0 12px; color: var(--text-secondary); font-size: 13.5px; }
.permatch { font-size: 12.5px; color: var(--text-secondary); display: grid; gap: 3px; }
.permatch a { color: var(--court-green); font-weight: 600; text-decoration: none; }
.permatch a:hover { text-decoration: underline; }
.mrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 16px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--border); }
.mrow:last-child { border-bottom: 0; }
.mrow .ev { font-size: 12.5px; color: var(--text-muted); }
.mrow h3 { margin: 1px 0 2px; font-size: 15px; color: var(--paddle); overflow-wrap: anywhere; }
.mrow .d { font-size: 13px; color: var(--text-secondary); }
.mrow .links { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.style { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.style li { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; padding: 8px 10px; background: var(--surface-2); border-radius: 8px; font-size: 13.5px; }
.style li .t { flex: 1 1 260px; } .style li .n { font-size: 12px; color: var(--text-muted); }
@media (max-width: 640px) { .mrow { grid-template-columns: 1fr; } .mrow .links { justify-content: flex-start; } }
</style>
<script src="accuracy.js?v=5"></script>
<script src="js/coach-core.js?v=1"></script>
</head>
<body>
<div class="topnav">
  <a class="brand" href="./"><img class="mark" src="brand/picklytics-mark-white.png" alt="" width="26" height="28">Picklytics <small>performance &amp; scouting from match video</small></a>
  <nav aria-label="Site"><a href="./">Matches</a><a href="players.html" class="on">Players</a><a href="review.html">Shot review</a><a href="hub.html?tab=accuracy">Accuracy</a><a href="label.html">Labeller</a></nav>
</div>
<div class="wrap" id="main"><div class="loading">Loading player…</div></div>
<script>
(function () {
"use strict";
const PB = window.PB, $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const getJSON = async u => { const r = await fetch(u, { cache: "no-store" }); if (!r.ok) throw new Error(u); return r.json(); };
const initials = n => n.split(/\s+/).map(w => w[0]).slice(0, 2).join("").toUpperCase();
const ALIASES = { "Sivashankar Sivan": ["Sivasankar Shivan"] };   // same spelling rule as pickleball/player_db.py

(async () => {
  let D, J;
  try { [D, J] = await Promise.all([getJSON("players.json"), getJSON("matches.json")]); } catch (e) { $("#main").innerHTML = `<div class="state-empty" role="alert">Player data could not be loaded.</div>`; return; }
  const p = D.players.find(x => x.id === new URLSearchParams(location.search).get("p"));
  if (!p) { $("#main").innerHTML = `<div class="state-empty">Player not found. <a href="players.html">All players</a></div>`; return; }
  document.title = `${p.name} · Picklytics`;
  const names = [p.name, ...(ALIASES[p.name] || [])];
  // this player's shots in every analysed match, per format (singles and doubles never mixed)
  const per = { singles: [], doubles: [] };
  for (const pm of p.matches) {
    const M = J.matches.find(m => m.id === pm.id);
    if (!M || !M.report) continue;
    let R; try { R = await getJSON(`../outputs/reports/${M.report}.json`); } catch (e) { continue; }
    const sel = R.type === "doubles" ? (PB.selectionOptions(R).find(o => o.kind === "player" && names.includes(o.key))) : PB.selectionOptions(R).find(o => names.includes(o.key));
    if (!sel) continue;
    let DBm = null;
    if (R.type === "doubles") { try { DBm = await getJSON(`../outputs/reports/${M.report}.doubles.json`); PB.applyHitters(R, DBm); } catch (e) { DBm = null; } }
    const shots = PB.shotsFor(R, sel);
    per[pm.type === "doubles" ? "doubles" : "singles"].push({ M, R, sel, pm, shots, DB: DBm });
  }
  const S = p.stats;
  const fmtBlock = (fmt, list) => {
    if (!list.length) return "";
    const shots = list.flatMap(x => x.shots), R0 = list[0].R;
    const obs = PB.observations(R0, list[0].sel, { shots, who: p.name, scope: list.length === 1 ? "1 match" : `${list.length} matches` });
    const L = PB.aggregate(shots, "landing"), sp = PB.speedStats(shots);
    const rows = PB.DEPTHS.map(d => [d, PB.WIDTHS.reduce((x, w) => x + ((L.cells[`${d} ${w}`] || []).length), 0)]);
    const card = (o, i) => {
      const f = Object.assign({ role: "all" }, o.link);
      const pm = list.map(x => { const a = PB.aggregate(PB.applyFilters(x.shots, f, f.view), f.view); const c = PB.selectShots(a, f.zone || "").length;
        const n = o.kind === "intercepted" ? ["bounced", "intercepted", "net"].reduce((t, k) => t + (a.status[k] || 0), 0) : a.denominator;
        return `<div><a href="hub.html${PB.stateToSearch(Object.assign({ m: x.M.id, p: x.sel.key, role: "all", view: "landing" }, o.link))}">${esc(x.M.title)} →</a> ${o.kind === "intercepted" ? a.status.intercepted || 0 : c} of ${n}</div>`; }).join("");
      return `<article class="obs"><div class="badges">${o.evidence === "human" ? '<span class="badge human">Human-reviewed</span>' : '<span class="badge auto">Automatically detected</span>'}${o.evidence === "proxy" ? '<span class="badge proxy">Includes position proxies</span>' : ""}${o.limited ? '<span class="badge limited">Limited sample</span>' : ""}</div>
        <h3>${esc(o.headline)}</h3><div class="measure">${esc(o.measure)}</div><div class="scope">${esc(o.scope)}</div>
        <ul class="q">${o.quality.map(q => `<li>${esc(q)}</li>`).join("")}</ul>
        <div class="permatch"><b style="color:var(--text-secondary)">Supporting matches - open to watch the shots:</b>${pm}</div></article>`;
    };
    const vals = [...new Set(list.map(x => x.M.tournament))].map(t => PB.venueValidation(t).short);
    return `<section class="fmtsec" aria-labelledby="h-${fmt}"><h2 id="h-${fmt}">${fmt === "singles" ? "Singles" : "Doubles"} <span class="fmt">${list.length} match${list.length === 1 ? "" : "es"}</span></h2>
      <p class="sub">${shots.length} analysed shots by ${esc(p.name)}${fmt === "doubles" ? " (shots credited to them by name; team-only numbers are not shown here)" : ""} · ${list.map(x => esc(x.M.title)).join(" · ")}</p>
      ${obs.length ? `<div class="obs-grid">${obs.map(card).join("")}</div>` : `<div class="state-empty">No observation is well enough supported in ${fmt} yet (${shots.length} shots). Counts are below.</div>`}
      <div class="sumstrip" style="margin-top:14px">
        <div><div class="l">Recorded landings</div><div class="v">${L.denominator}<small> of ${L.population} that bounced first</small></div><div class="n">${L.boundary.length} on a zone boundary · ${L.outside.length} estimated outside</div></div>
        <div><div class="l">Landing depth</div><div class="v" style="font-size:17px">${rows.map(([d, n]) => `${PB.pct(n, L.denominator) ?? 0}%<small> ${d}</small>`).join(" ")}</div><div class="n">shares of the ${L.denominator} recorded landings</div></div>
        <div><div class="l">Estimated speed <span class="badge est">estimated</span></div><div class="v">${sp.median ?? "Unknown"}<small>${sp.median != null ? " mph median" : ""}</small></div><div class="n">usable for ${sp.usable} of ${sp.n} shots · not radar-checked</div></div>
      </div>
      <p class="note">${vals.map(esc).join(" ")}</p>
      ${fmt === "doubles" && list.some(x => x.DB && x.DB.players[x.sel.key]) ? `<div class="panel tablewrap" style="margin-top:12px"><h3>In the partnership <span class="badge est">estimated</span></h3><p class="sub">Per match, from named positions and the shots credited to ${esc(p.name)}.</p>
        <table class="t"><tr><th>Match</th><th class="r">Rally-shot share</th><th class="r">Up (≤${list.find(x => x.DB).DB.up_ft} ft)</th><th class="r">On the left</th><th class="r">Middle balls</th><th class="r">Cross-overs</th><th class="r">Distance / rally</th></tr>
        ${list.filter(x => x.DB && x.DB.players[x.sel.key]).map(x => { const q = x.DB.players[x.sel.key]; return `<tr><td><a href="hub.html?m=${x.M.id}&sec=partnership&p=${encodeURIComponent(x.sel.key)}">${esc(x.M.title)}</a></td><td class="r">${q.shots.team_rally_share_pct ?? "–"}%</td><td class="r">${q.position.up_pct ?? "–"}%</td><td class="r">${q.position.left_pct ?? "–"}%</td><td class="r">${q.middle.taken}</td><td class="r">${q.cross.n}</td><td class="r">${q.movement.dist_per_rally_ft ?? "–"} ft</td></tr>`; }).join("")}</table></div>` : ""}
    </section>`;
  };
  const matchRows = p.matches.map(m => `<div class="mrow"><div>
      <div class="ev">${esc(m.tournament)} · ${esc(m.type)}</div><h3>${esc(m.title)}</h3>
      <div class="d">${esc(m.round || "")}${m.partner.length ? ` · with ${esc(m.partner.join(", "))}` : ""} · vs ${esc(m.opponents.join(" / "))}</div>
      <div class="d">${m.shots} shots by ${esc(p.name)} in ${m.rallies} rallies${m.official ? ` · <span class="badge official">Official</span> ${esc(m.official)}` : ""}</div></div>
      <div class="links"><a class="btn primary sm" href="hub.html?m=${m.id}&p=${encodeURIComponent(m.type === "doubles" ? p.name : p.name)}">Open match workspace →</a><a class="btn sm" href="scout.html?m=${m.id}&p=${encodeURIComponent(p.name)}">Coaching brief</a></div></div>`).join("");
  const styleItems = p.style.map(l => `<li><span class="t">${esc(l.text)}${l.kind === "experimental" ? ' <span class="badge exp">experimental</span>' : ""}${l.small ? ' <span class="badge limited">limited sample</span>' : ""}</span><span class="n">${l.n} shots</span></li>`).join("");
  const sg = p.singles || [], v = (x, u = "") => x == null ? "–" : `${Math.round(x)}${u}`;
  const total = per.singles.length + per.doubles.length;
  $("#main").innerHTML = `
    <nav class="crumb" aria-label="Breadcrumb"><a href="players.html">Players</a><span aria-hidden="true">›</span><span class="here">${esc(p.name)}</span></nav>
    <div class="phead"><span class="av" aria-hidden="true">${initials(p.name)}</span><div style="min-width:0"><h1>${esc(p.name)}</h1>
      <div class="meta">${p.team ? esc(p.team) + " · " : ""}${esc(p.tournaments.join(" · "))}</div></div></div>
    <p class="pscope"><b>Scope:</b> ${p.matches.length} analysed match${p.matches.length === 1 ? "" : "es"} (${p.matches.filter(m => m.type === "singles").length} singles, ${p.matches.filter(m => m.type === "doubles").length} doubles) - only matches we have video for. This is not a complete career profile. Singles and doubles are kept apart.${total < p.matches.length ? ` ${p.matches.length - total} match${p.matches.length - total === 1 ? " has" : "es have"} no placement report yet.` : ""}</p>
    ${fmtBlock("singles", per.singles)}${fmtBlock("doubles", per.doubles)}
    ${!total ? `<div class="state-empty" style="margin-top:20px">No placement data for this player yet.</div>` : ""}
    <section class="fmtsec" aria-labelledby="h-m"><h2 id="h-m">Matches</h2><div class="panel">${matchRows}</div></section>
    <section class="fmtsec" aria-labelledby="h-sec"><h2 id="h-sec">Secondary technical detail</h2><p class="sub">Older summaries built on automatic shot-type labels, plus experimental measures. Read with their labels.</p>
      <details class="more"><summary>From shot-type labels <span class="s"><span class="badge auto">automatic labels</span> compared with the other players here (different levels)</span></summary><div class="body"><ul class="style">${styleItems || "<li>Not enough shots yet.</li>"}</ul><p class="note">Shot types are automatic (drives and dinks mostly right; drops and resets often missed). ${esc(D.note)}</p></div></details>
      <details class="more"><summary>Spin &amp; net clearance <span class="s"><span class="badge exp">experimental</span></span></summary><div class="body note">${S.spin.n ? `Topspin ${S.spin.topspin}%, slice ${S.spin.slice}% of ${S.spin.n} shots with a believable 3D flight${S.clear.soft != null ? `; soft shots clear the net by about ${S.clear.soft} ft (${S.clear.soft_n})` : ""}${S.clear.drive != null ? `; drives by about ${S.clear.drive} ft (${S.clear.drive_n})` : ""}. Not checked against hand labels.` : "No 3D flights yet."}</div></details>
      ${sg.length ? `<details class="more"><summary>Singles: movement and time pressure <span class="s"><span class="badge est">estimated</span> per match</span></summary><div class="body tablewrap"><table class="t"><tr><th>Match</th><th class="r">Distance / rally</th><th class="r">Top sprint</th><th class="r">Reached net</th><th class="r">Rushed on</th><th class="r">Rushes opponent</th></tr>
        ${sg.map(x => { const m = p.matches.find(y => y.id === x.match); return `<tr><td><a href="hub.html?m=${x.match}&sec=movement&p=${encodeURIComponent(p.name)}">${esc(m ? m.title : x.match)}</a></td><td class="r">${v(x.dist_per_rally_ft, " ft")}</td><td class="r">${x.top_sprint_mph ?? "–"} mph</td><td class="r">${v(x.net_reached_pct, "%")}</td><td class="r">${v(x.rushed_pct, "%")}</td><td class="r">${v(x.rushes_opp_pct, "%")}</td></tr>`; }).join("")}</table></div></details>` : ""}
    </section>`;
})();
})();
</script>
</body>
</html>
