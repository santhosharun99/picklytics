<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><link rel="icon" href="brand/picklytics-mark.png">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coaching brief · Picklytics</title>
<link rel="stylesheet" href="theme.css?v=7">
<style>
.bhead { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 12px 24px; }
.bhead h1 { margin: 2px 0 4px; font-size: 26px; letter-spacing: -.015em; color: var(--paddle); overflow-wrap: anywhere; }
.bhead .ctx { color: var(--text-secondary); font-size: 14px; }
.bactions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.bsec { margin-top: 22px; }
.bsec > h2 { margin: 0 0 4px; font-size: 18px; color: var(--paddle); }
.bsec > .sub { margin: 0 0 12px; color: var(--text-secondary); font-size: 13.5px; }
.item { background: var(--surface-1); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; display: grid; gap: 6px; break-inside: avoid; }
.item + .item { margin-top: 12px; }
.item h3 { margin: 0; font-size: 16px; color: var(--paddle); line-height: 1.35; }
.item .measure { font-weight: 650; font-variant-numeric: tabular-nums; }
.item .scope { font-size: 12.5px; color: var(--text-secondary); }
.item ul.q { margin: 0; padding-left: 18px; font-size: 12.5px; color: var(--text-muted); }
.item .clips { font-size: 12.5px; color: var(--text-secondary); display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; }
.item .clips a { color: var(--court-green); font-weight: 600; text-decoration: none; }
.item .clips a:hover { text-decoration: underline; }
.item .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.cnote { border-left: 4px solid var(--ball); background: var(--lime-bg); border-radius: 0 8px 8px 0; padding: 8px 10px; }
.cnote label { display: block; font-size: 12px; font-weight: 700; color: var(--lime-ink); text-transform: uppercase; letter-spacing: .04em; margin-bottom: 4px; }
.cnote textarea { width: 100%; min-height: 58px; font: inherit; font-size: 14px; border: 1px solid #d5ea8f; border-radius: 6px; padding: 6px 8px; background: #fff; resize: vertical; }
.cnote .ptext { white-space: pre-wrap; display: none; }
.saved-tag { font-size: 12px; color: var(--text-muted); }
.kgrid { display: grid; gap: 0; grid-template-columns: repeat(auto-fit, minmax(min(220px, 100%), 1fr)); border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface-1); overflow: hidden; }
.kgrid > div { padding: 12px 16px; border-right: 1px solid var(--border); border-bottom: 1px solid var(--border); margin: 0 -1px -1px 0; }
.kgrid .l { font-size: 12.5px; color: var(--text-secondary); } .kgrid .v { font-size: 19px; font-weight: 700; color: var(--paddle); font-variant-numeric: tabular-nums; } .kgrid .v small { font-size: 13px; font-weight: 500; color: var(--text-secondary); } .kgrid .n { font-size: 12px; color: var(--text-muted); }
.sec2 li { margin: 4px 0; }
.qbox { font-size: 12.5px; color: var(--text-secondary); background: var(--surface-1); border: 1px dashed var(--border-strong); border-radius: var(--radius); padding: 12px 14px; }
.qbox p { margin: 0 0 6px; } .qbox p:last-child { margin: 0; }
.printonly { display: none; }
@media print {
  @page { margin: 14mm 12mm; }
  body { font-size: 11.5pt; }
  .bhead h1 { font-size: 20pt; }
  .item, .kgrid, .qbox { border-color: #bbb; }
  .cnote textarea { display: none; } .cnote .ptext { display: block; }
  .cnote.empty { display: none; }
  .printonly { display: block; }
  .item .clips a { color: inherit; }
  .bsec { break-inside: auto; }
  .bsec > h2 { break-after: avoid; }
}
</style>
<script src="accuracy.js?v=5"></script>
<script src="js/coach-core.js?v=1"></script>
<script src="js/brief-store.js?v=1"></script>
</head>
<body>
<div class="topnav">
  <a class="brand" href="./"><img class="mark" src="brand/picklytics-mark-white.png" alt="" width="26" height="28">Picklytics <small>performance &amp; scouting from match video</small></a>
  <nav aria-label="Site"><a href="matches.html">Matches</a><a href="players.html">Players</a><a href="review.html">Shot review</a><a href="hub.html?tab=accuracy">Accuracy</a><a href="label.html">Labeller</a></nav>
</div>
<div class="wrap" id="main"><div class="loading">Loading brief…</div></div>
<script>
(function () {
"use strict";
const PB = window.PB, $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const getJSON = async u => { const r = await fetch(u, { cache: "no-store" }); if (!r.ok) throw new Error(u); return r.json(); };
const q = new URLSearchParams(location.search);
let J, M, T, R, SEL, RNO, DB = null;

async function init() {
  try { J = await getJSON("matches.json"); } catch (e) { return fail("The match list could not be loaded."); }
  // ?m=<match>&p=<player/team>; older links used ?report=<report>&player=<name>
  M = J.matches.find(m => m.id === q.get("m")) || J.matches.find(m => m.report && m.report === q.get("report"));
  if (!M) return fail(`Match not found. <a href="matches.html">All matches</a>`);
  if (!M.report) return fail(`No match report for <b>${esc(M.title)}</b> yet, so there is nothing to brief from. <a href="hub.html?m=${encodeURIComponent(M.id)}">Back to the match</a>`);
  try { R = await getJSON(`../outputs/reports/${M.report}.json`); } catch (e) { return fail("The match report could not be loaded."); }
  if (R.type === "doubles") { try { DB = await getJSON(`../outputs/reports/${M.report}.doubles.json`); PB.applyHitters(R, DB); } catch (e) { DB = null; } }
  T = (J.tournaments || []).find(t => t.id === M.tournament);
  RNO = new Map(R.rallies.map((r, i) => [r.id, i + 1]));
  SEL = PB.resolveSelection(R, q.get("p") || q.get("player") || "");
  history.replaceState(null, "", `?m=${encodeURIComponent(M.id)}&p=${encodeURIComponent(SEL.key)}`);
  render();
}
function fail(h) { $("#main").innerHTML = `<div class="state-empty" role="alert">${h}</div>`; }
const who = () => SEL.kind === "side" && R.type === "doubles" ? `${SEL.key} (team)` : SEL.key;
const ws = st => `hub.html${PB.stateToSearch(Object.assign({ m: M.id, p: SEL.key }, st))}`;

function clipLinks(item) {
  if (!item.clips || !item.clips.length) return "";
  return `<div class="clips"><span>Supporting clips:</span>${item.clips.map((c, i) => `<a href="${esc(item.link)}${item.link.includes("?") ? "&" : "?"}clip=${i + 1}">rally ${RNO.get(c.rally) ?? c.rally} (${PB.fmtTime(c.t)})</a>`).join(" ")}<a class="noprint" href="${esc(item.link)}">open in the workspace →</a></div>`;
}
function render() {
  document.title = `Coaching brief · ${SEL.key} · ${M.title}`;
  const shots = PB.shotsFor(R, SEL), obs = PB.observations(R, SEL, { shots, who: who() });
  const saved = PBBrief.list(M.id, SEL.key), stored = PBBrief.available();
  const val = PB.venueValidation(M.tournament);
  const opts = PB.selectionOptions(R);
  const L = PB.aggregate(shots, "landing"), sp = PB.speedStats(shots);
  const roleSpeed = [["serve", "Serves"], ["return", "Returns"], ["third", "Third shots"], ["later", "Later rally shots"]].map(([k, l]) => [l, PB.speedStats(PB.applyFilters(shots, { role: k }, "origin"))]);
  const rows = PB.DEPTHS.map(d => [d, PB.WIDTHS.reduce((x, w) => x + ((L.cells[`${d} ${w}`] || []).length), 0)]);
  const P = R.players[SEL.side] || {}, T2 = P.tactics || {};
  const third = Object.entries(P.third_shot || {}).sort((a, b) => b[1].count - a[1].count), thirdN = third.reduce((x, [, v]) => x + v.count, 0);
  const bh = (T2.strokes || {}).backhand || {}, nbh = Object.values(bh).reduce((a, b) => a + b, 0);
  const autoSaved = obs.map(o => `${M.id}|${SEL.key}|${o.id}`);
  $("#main").innerHTML = `
    <nav class="crumb noprint" aria-label="Breadcrumb"><a href="matches.html">Tournaments</a><span aria-hidden="true">›</span>${T ? `<a href="matches.html?t=${encodeURIComponent(T.id)}">${esc(T.name)}</a><span aria-hidden="true">›</span>` : ""}<a href="hub.html?m=${encodeURIComponent(M.id)}&p=${encodeURIComponent(SEL.key)}">${esc(M.title)}</a><span aria-hidden="true">›</span><span class="here">Coaching brief</span></nav>
    <div class="bhead"><div style="min-width:0"><div class="note">Coaching brief · ${esc(M.event)} · ${esc(M.round)}</div>
      <h1>${esc(who())}</h1>
      <div class="ctx">${esc(M.title)}${(R.official || M.result) ? ` · <span class="badge official">Official result</span> ${esc(R.official || M.result)}` : ""} · ${shots.length} analysed shots in this match</div></div>
      <div class="bactions noprint">${opts.length > 1 ? `<label class="sr" for="bwho">Brief for</label><select id="bwho" class="btn">${opts.map(o => `<option value="${esc(o.key)}"${o.key === SEL.key ? " selected" : ""}>${esc(o.kind === "side" && R.type === "doubles" ? `${o.key} (team)` : o.key)}</option>`).join("")}</select>` : ""}
        <a class="btn" href="hub.html?m=${encodeURIComponent(M.id)}&p=${encodeURIComponent(SEL.key)}">← Match workspace</a><button type="button" class="btn primary" id="printBtn">Print / save PDF</button></div></div>

    <section class="bsec" aria-labelledby="h1s"><h2 id="h1s">Saved for this brief</h2>
      <p class="sub">${stored ? "Saved on this device (this browser only) - not shared or synced." : "Browser storage is blocked here, so saved items last only until this page is closed."} Coach notes are your own words, kept apart from the measured numbers.</p>
      ${saved.length ? saved.map(itemHTML).join("") : `<div class="state-empty">Nothing saved yet. Use <b>Save to brief</b> on an observation below, or on a court selection in <a href="${ws({ sec: "placement" })}">Placement &amp; speed</a>.</div>`}
    </section>

    <section class="bsec" aria-labelledby="h2s"><h2 id="h2s">Automatic observations</h2>
      <p class="sub">Descriptive tendencies from the tracking, each with its count, scope and evidence. Shown only when the sample clears fixed minimums - ${obs.length} ${obs.length === 1 ? "is" : "are"} supported here. They are not tactical advice.</p>
      ${saved.some(x => autoSaved.includes(x.id)) ? `<p class="note">${saved.filter(x => autoSaved.includes(x.id)).length} of these ${saved.filter(x => autoSaved.includes(x.id)).length === 1 ? "is" : "are"} already in your saved items above and not repeated here.</p>` : ""}
      ${obs.length ? obs.map((o, i) => PBBrief.has(autoSaved[i]) ? "" : `<article class="item"><div class="row">${o.evidence === "human" ? '<span class="badge human">Human-reviewed</span>' : '<span class="badge auto">Automatically detected</span>'}${o.evidence === "proxy" ? '<span class="badge proxy">Includes position proxies</span>' : ""}${o.limited ? '<span class="badge limited">Limited sample</span>' : ""}</div>
        <h3>${esc(o.headline)}</h3><div class="measure">${esc(o.measure)}</div><div class="scope">${esc(o.scope)}</div>
        <ul class="q">${[...o.quality, ...(o.kind === "landing" && val ? [val.short] : [])].map(x => `<li>${esc(x)}</li>`).join("")}</ul>
        ${clipLinks({ link: ws(Object.assign({ role: "all", view: "landing" }, o.link)), clips: obsClips(o) })}
        <div class="row noprint"><button type="button" class="btn sm" data-save="${i}" aria-pressed="${PBBrief.has(autoSaved[i])}">${PBBrief.has(autoSaved[i]) ? "✓ Saved - add a note above" : "Save and add a note"}</button></div></article>`).join("")
        : `<div class="state-empty">No observation is well enough supported for ${esc(who())} in this match (${shots.length} analysed shots). The numbers below are still valid as counts.</div>`}
    </section>

    <section class="bsec" aria-labelledby="h3s"><h2 id="h3s">Placement &amp; speed numbers</h2>
      <p class="sub">${esc(who())} · all shots in this match · estimated speed = launch speed off the paddle, median whole mph, usable estimates only (not radar-checked).</p>
      <div class="kgrid">
        <div><div class="l">Recorded landings (observed first bounce)</div><div class="v">${L.denominator}<small> of ${L.population} that bounced first</small></div><div class="n">${L.boundary.length} on a zone boundary · ${L.outside.length} estimated outside</div></div>
        <div><div class="l">Landing depth</div><div class="v">${rows.map(([d, n]) => `${PB.pct(n, L.denominator) ?? 0}%<small> ${d}</small>`).join(" ")}</div><div class="n">shares of the ${L.denominator} landings (boundary / outside ones in no row)</div></div>
        <div><div class="l">Outgoing flight</div><div class="v" style="font-size:15px">${[["bounced", "bounced first"], ["intercepted", "intercepted"], ["net", "net"], ["unresolved", "unresolved"]].map(([k, l]) => `${L.status[k] || 0} ${l}`).join(" · ")}</div><div class="n">of ${shots.length} shots</div></div>
        <div><div class="l">Estimated speed, all shots</div><div class="v">${sp.median ?? "–"}<small>${sp.median != null ? " mph" : ""}</small></div><div class="n">usable for ${sp.usable} of ${sp.n}</div></div>
        ${roleSpeed.map(([l, s]) => `<div><div class="l">Estimated speed, ${l.toLowerCase()}</div><div class="v">${s.median ?? "Unknown"}<small>${s.median != null ? " mph" : ""}</small></div><div class="n">usable for ${s.usable} of ${s.n}${s.usable && s.usable < 10 ? " · limited sample" : ""}</div></div>`).join("")}
      </div>
    </section>

    ${DB ? partnershipBlock() : ""}
    ${!(SEL.kind === "player") && (third.length || nbh >= 8 || (P.net && P.net.rallies && R.type !== "doubles")) ? `<section class="bsec" aria-labelledby="h4s"><h2 id="h4s">Secondary: from automatic shot-type labels and positions</h2>
      <p class="sub"><span class="badge auto">Automatic labels</span> drives and dinks are mostly recognised; drops (19%) and resets (4%) are often missed, so treat type splits as rough.</p>
      <ul class="sec2">
        ${third.length ? `<li>Third shots by label: ${third.map(([k, v]) => `${esc(k)} ${v.count}`).join(", ")} (of ${thirdN}).</li>` : ""}
        ${nbh >= 8 ? `<li>Backhands by the move before them (${nbh}): pulled wide ${PB.pct(bh.pulled_wide || 0, nbh)}%, near the body ${PB.pct(bh.near_body || 0, nbh)}%, ran around ${PB.pct(bh.ran_around || 0, nbh)}% <span class="badge est">estimated</span>.</li>` : ""}
        ${P.net && P.net.rallies && R.type !== "doubles" ? `<li>Reached the net in ${P.net.reached_pct}% of ${P.net.rallies} rallies (median ${P.net.median_arrival_s ?? "–"} s after the serve) <span class="badge est">estimated</span>.</li>` : ""}
      </ul></section>` : ""}

    <section class="bsec" aria-labelledby="h5s"><h2 id="h5s">How far to trust this</h2>
      <div class="qbox"><p><b>Venue:</b> ${esc(val.detail)}</p>
        <p><b>Evidence:</b> landings ${L.recorded.filter(s => PB.evidenceOf(s, "landing") === "human").length} human-reviewed, ${L.recorded.filter(s => PB.evidenceOf(s, "landing") !== "human").length} automatic. Locations are seen from behind the hitter (left = hitter's left); zones: kitchen 0–7 ft, midcourt 7–14.5 ft, deep 14.5–22 ft from the net, thirds across.</p>
        <p><b>Scope:</b> one match (${esc(M.title)}). ${R.type === "doubles" ? "Doubles rally winners from tracking are unreliable and are not used. " : ""}Projected landings of intercepted balls are not available. Speed is not checked against radar.</p>
        <p class="printonly">Printed from Picklytics · ${new Date().toLocaleDateString()} · full detail: hub.html?m=${esc(M.id)}</p></div>
    </section>`;
  $("#printBtn").onclick = () => print();
  $("#bwho") && ($("#bwho").onchange = e => { SEL = PB.resolveSelection(R, e.target.value); history.replaceState(null, "", `?m=${encodeURIComponent(M.id)}&p=${encodeURIComponent(SEL.key)}`); render(); });
  $$("[data-save]").forEach(b => b.onclick = () => {
    const o = obs[+b.dataset.save], id = autoSaved[+b.dataset.save];
    if (PBBrief.has(id)) PBBrief.remove(id);
    else PBBrief.add({ id, match: M.id, who: SEL.key, auto: true, headline: o.headline, measure: o.measure, scope: o.scope, quality: o.quality, link: ws(Object.assign({ role: "all", view: "landing" }, o.link)), clips: obsClips(o) });
    render();
    if (PBBrief.has(id)) $(`textarea[data-id="${CSS.escape(id)}"]`)?.focus();
  });
  $$("textarea[data-id]").forEach(t => t.addEventListener("input", () => { PBBrief.setNote(t.dataset.id, t.value); t.closest(".cnote").querySelector(".ptext").textContent = t.value; t.closest(".cnote").classList.toggle("empty", !t.value.trim()); }));
  $$("[data-remove]").forEach(b => b.onclick = () => { PBBrief.remove(b.dataset.remove); render(); });
}
function partnershipBlock() {
  const T0 = DB.teams[SEL.side]; if (!T0) return "";
  const pl = Object.entries(DB.players).filter(([, p]) => p.team === SEL.side);
  const pc = v => v == null ? "–" : v + "%";
  return `<section class="bsec" aria-labelledby="hps"><h2 id="hps">Partnership: ${esc(SEL.side)}</h2>
    <p class="sub"><span class="badge est">estimated</span> from named player positions (about ±1 ft; depth-corrected: ${!DB.depth ? "none" : String(DB.depth.method).startsWith("rig") ? "one value for this court and camera" : {"kitchen line": "kitchen-line rule", rules: "server-stance rule"}[DB.depth.method] || "default height"}) and the shots credited to each player. “Up” = within ${DB.up_ft} ft of the net.</p>
    <div class="kgrid">
      <div><div class="l">Both partners up</div><div class="v">${pc(T0.formation_time_pct.both_up)}<small> of rally time</small></div><div class="n">both back ${pc(T0.formation_time_pct.both_back)} · ${T0.pair_rallies} rallies</div></div>
      <div><div class="l">Distance between partners</div><div class="v">${T0.spacing.median_ft ?? "–"}<small> ft</small></div><div class="n">${T0.spacing.lateral_ft ?? "–"} ft sideways (median)</div></div>
      <div><div class="l">Side switches</div><div class="v">${T0.switches.rallies}<small> of ${T0.switches.of} rallies</small></div><div class="n">left side: ${Object.entries(T0.left_side_pct).map(([n, v]) => `${esc(n)} ${v}%`).join(", ")}</div></div>
      ${pl.map(([n, p]) => `<div><div class="l">${esc(n)}${SEL.key === n ? " (this brief)" : ""}</div><div class="v" style="font-size:15px">${pc(p.shots.team_rally_share_pct)} of rally shots · up ${pc(p.position.up_pct)}</div><div class="n">${p.middle.taken} middle balls · ${p.cross.n} cross-overs · left ${pc(p.position.left_pct)} · ${p.movement.dist_per_rally_ft ?? "–"} ft per rally</div></div>`).join("")}
    </div></section>`;
}
function obsClips(o) {
  const f = Object.assign({ role: "all" }, o.link), agg = PB.aggregate(PB.applyFilters(PB.shotsFor(R, SEL), f, f.view), f.view);
  return PB.selectShots(agg, f.zone || "").slice(0, 8).map(s => ({ rally: s.rid, t: Math.round(PB.clipWindow(R, s, f.view).hit) }));
}
function itemHTML(x) {
  return `<article class="item"><div class="row">${x.auto ? '<span class="badge auto">Automatic observation</span>' : '<span class="badge est">Court selection saved by the coach</span>'}<span class="saved-tag">saved ${new Date(x.saved).toLocaleDateString()}</span></div>
    <h3>${esc(x.headline)}</h3><div class="measure">${esc(x.measure)}</div><div class="scope">${esc(x.scope)}</div>
    ${x.quality && x.quality.length ? `<ul class="q">${x.quality.map(z => `<li>${esc(z)}</li>`).join("")}</ul>` : ""}
    ${clipLinks(x)}
    <div class="cnote${x.note && x.note.trim() ? "" : " empty"}"><label for="n-${esc(x.id)}">Coach note</label><textarea id="n-${esc(x.id)}" data-id="${esc(x.id)}" placeholder="Your note (saved on this device as you type)">${esc(x.note || "")}</textarea><div class="ptext">${esc(x.note || "")}</div></div>
    <div class="row noprint"><button type="button" class="btn sm ghost" data-remove="${esc(x.id)}">Remove from brief</button></div></article>`;
}
init();
})();
</script>
</body>
</html>
