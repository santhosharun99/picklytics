<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3D Ball Replay</title>
<script src="https://cdn.jsdelivr.net/npm/plotly.js-dist-min@2.35.2/plotly.min.js"></script>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --ink:#1d2330; --muted:#667085; --line:#e3e6eb; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#12151b; --card:#1b1f27; --ink:#e7e9ee; --muted:#9aa3b2; --line:#2a303b; } }
  :root[data-theme="dark"] { --bg:#12151b; --card:#1b1f27; --ink:#e7e9ee; --muted:#9aa3b2; --line:#2a303b; }
  body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.45 system-ui, sans-serif; }
  header { padding:14px 16px; display:flex; gap:12px; align-items:center; flex-wrap:wrap; border-bottom:1px solid var(--line); }
  h1 { font-size:17px; margin:0; }
  select { font:inherit; padding:5px 8px; border-radius:6px; border:1px solid var(--line); background:var(--card); color:var(--ink); }
  #plot { height:calc(100vh - 130px); min-height:420px; }
  .note { color:var(--muted); padding:8px 16px; font-size:13px; }
  .key span { display:inline-block; margin-right:14px; }
  .dot { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:4px; vertical-align:-1px; }
</style>
</head>
<body>
<header>
  <h1>3D ball replay</h1>
  <select id="rally"></select>
  <span class="key"><span><i class="dot" style="background:#e8590c"></i>ball path (fitted)</span><span><i class="dot" style="background:#1971c2"></i>detected hit</span><span><i class="dot" style="background:#2f9e44"></i>detected bounce</span><span><i class="dot" style="background:#fff;border:2px solid #c92a2a"></i>your tagged hit (position = nearest detected contact)</span></span>
</header>
<div id="plot"></div>
<div class="note" id="note"></div>
<script>
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function courtTraces() {
  const L = (xs, ys, zs, color, w) => ({type:'scatter3d', mode:'lines', x:xs, y:ys, z:zs, line:{color, width:w}, hoverinfo:'skip', showlegend:false});
  const c = '#9aa3b2';
  return [
    L([0,20,20,0,0],[0,0,44,44,0],[0,0,0,0,0],c,4),
    L([0,20],[15,15],[0,0],c,3), L([0,20],[29,29],[0,0],c,3),
    L([10,10],[0,15],[0,0],c,2), L([10,10],[29,44],[0,0],c,2),
    L([-1,10,21],[22,22,22],[3,2.83,3],'#495057',6),
    L([-1,-1],[22,22],[0,3],'#495057',4), L([21,21],[22,22],[0,3],'#495057',4),
  ];
}
fetch('replay3d.json').then(r => r.json()).then(data => {
  const sel = document.getElementById('rally');
  data.forEach((r, i) => sel.add(new Option(`Rally at ${r.name}  (${r.true_hits.length} tagged hits)`, i)));
  sel.onchange = () => draw(data[sel.value]);
  draw(data[0]);
});
function draw(r) {
  const tr = courtTraces();
  r.arcs.forEach((a, i) => tr.push({type:'scatter3d', mode:'lines', x:a.map(p=>p[0]), y:a.map(p=>p[1]), z:a.map(p=>p[2]),
    line:{color:'#e8590c', width:5}, name:'ball', showlegend:false, hovertemplate:'x %{x:.1f} ft<br>y %{y:.1f} ft<br>height %{z:.1f} ft<extra></extra>'}));
  const ev = k => r.events.filter(e => e.kind === k);
  [['hit','#1971c2'],['bounce','#2f9e44']].forEach(([k,c]) => tr.push({type:'scatter3d', mode:'markers', name:k,
    x:ev(k).map(e=>e.pos[0]), y:ev(k).map(e=>e.pos[1]), z:ev(k).map(e=>e.pos[2]), marker:{size:6, color:c},
    text:ev(k).map(e=>`${k}${e.player ? ' by '+e.player : ''} · frame ${e.frame} · height ${e.pos[2].toFixed(1)} ft`), hovertemplate:'%{text}<extra></extra>', showlegend:false}));
  const tagged = r.true_hits.map(f => r.events.reduce((b, e) => !b || Math.abs(e.frame-f) < Math.abs(b.frame-f) ? e : b, null)).filter(Boolean);
  tr.push({type:'scatter3d', mode:'markers', x:tagged.map(e=>e.pos[0]), y:tagged.map(e=>e.pos[1]), z:tagged.map(e=>e.pos[2]),
    marker:{size:10, color:'rgba(0,0,0,0)', line:{color:'#c92a2a', width:3}}, hoverinfo:'skip', showlegend:false});
  Object.entries(r.players).forEach(([id, pts]) => tr.push({type:'scatter3d', mode:'lines', x:pts.map(p=>p[0]), y:pts.map(p=>p[1]), z:pts.map(()=>0.05),
    line:{color:'#adb5bd', width:2, dash:'dot'}, name:id, hoverinfo:'name', showlegend:false}));
  const ax = (t, r) => ({title:t, range:r, color:css('--muted'), gridcolor:css('--line'), zerolinecolor:css('--line')});
  Plotly.react('plot', tr, {paper_bgcolor:css('--bg'), margin:{l:0,r:0,t:0,b:0},
    scene:{xaxis:ax('across (ft)',[-8,28]), yaxis:ax('along court (ft)',[-15,60]), zaxis:ax('height (ft)',[0,15]),
      aspectmode:'manual', aspectratio:{x:0.6, y:1.25, z:0.35}, camera:{eye:{x:1.4, y:1.3, z:0.7}}}}, {responsive:true});
  const hits = ev('hit').length, b = ev('bounce').length;
  document.getElementById('note').textContent = `Auto-detected from video only (your tags not used): ${hits} hits, ${b} bounces. You tagged ${r.true_hits.length} hits. Dotted grey = player paths. Drag to rotate, scroll to zoom.`;
}
</script>
</body>
</html>
