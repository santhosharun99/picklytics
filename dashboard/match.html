<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Match Analysis</title>
<style>
:root {
  color-scheme: light;
  --bg: #f4f3ef; --surface-1: #fcfcfb; --surface-2: #f0efec; --border: #e2e1dc;
  --text-primary: #0b0b0b; --text-secondary: #52514e; --text-muted: #85847f;
  --series-1: #2a78d6; --series-2: #eb6834; --good: #1baf7a; --bad: #e34948; --note: #eda100;
  --court: #256abf; --court-kitchen: #184f95; --court-line: #ffffff; --court-out: #3f6b4a;
  --seq-1: #cde2fb; --seq-2: #9ec5f4; --seq-3: #6da7ec; --seq-4: #3987e5; --seq-5: #256abf; --seq-6: #184f95;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text-primary);
  font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
header { padding: 16px 24px; border-bottom: 1px solid var(--border); background: var(--surface-1);
  display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; }
header h1 { margin: 0; font-size: 19px; }
header .sub { color: var(--text-secondary); font-size: 13px; }
.tabs { display: flex; gap: 6px; }
.tab { border: 1px solid var(--border); background: var(--surface-2); color: inherit; font: inherit;
  padding: 7px 14px; border-radius: 999px; cursor: pointer; display: flex; gap: 8px; align-items: center; }
.tab.on { background: var(--text-primary); color: var(--surface-1); border-color: var(--text-primary); }
.dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
main { max-width: 1300px; margin: 0 auto; padding: 20px 24px 60px; display: grid; gap: 18px; }
.grid { display: grid; gap: 18px; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
.card { background: var(--surface-1); border: 1px solid var(--border); border-radius: 10px; padding: 16px; min-width: 0; }
.card h2 { margin: 0 0 4px; font-size: 14px; }
.card .why { color: var(--text-muted); font-size: 12px; margin: 0 0 12px; }
.tiles { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
.tile { background: var(--surface-1); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; }
.tile .l { font-size: 12px; color: var(--text-secondary); }
.tile .v { font-size: 26px; font-weight: 650; font-variant-numeric: tabular-nums; }
.tile .n { font-size: 11px; color: var(--text-muted); }
.ins { display: grid; gap: 8px; }
.ins div { display: flex; gap: 10px; align-items: baseline; padding: 8px 10px; border-radius: 8px; background: var(--surface-2); }
.badge { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .03em; min-width: 72px; }
.badge.strength { color: var(--good); } .badge.weakness { color: var(--bad); } .badge.pattern { color: var(--series-1); }
.small { color: var(--note); font-size: 11px; white-space: nowrap; }
.clips { display: inline-flex; gap: 4px; flex-wrap: wrap; margin-left: auto; }
.clip { border: 1px solid var(--border); background: var(--surface-1); color: inherit; font: inherit; font-size: 11px;
  border-radius: 6px; padding: 1px 7px; cursor: pointer; }
.clip:hover { border-color: var(--series-1); }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); }
th { color: var(--text-secondary); font-weight: 500; font-size: 12px; }
svg text { fill: var(--text-secondary); font-size: 11px; }
.empty { color: var(--text-muted); font-size: 13px; }
.bar { display: grid; grid-template-columns: 120px 1fr 44px; gap: 8px; align-items: center; margin: 5px 0; font-size: 13px; }
.bar .track { background: var(--surface-2); border-radius: 4px; height: 10px; overflow: hidden; }
.bar .fill { height: 100%; border-radius: 4px; }
.split { display: flex; height: 12px; border-radius: 6px; overflow: hidden; gap: 2px; margin: 6px 0; }
.modal { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: none; align-items: center; justify-content: center; z-index: 20; }
.modal.on { display: flex; }
.modal .box { background: var(--surface-1); border-radius: 12px; padding: 14px; width: min(960px, 94vw); }
.modal video { width: 100%; border-radius: 8px; background: #000; }
.modal .row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
button.plain { border: 1px solid var(--border); background: var(--surface-2); color: inherit; font: inherit; border-radius: 6px; padding: 4px 10px; cursor: pointer; }
</style>
<link rel="stylesheet" href="theme.css">
</head>
<body>
<header>
  <div><h1 id="title">Match analysis</h1><div class="sub" id="source"></div></div>
  <div class="tabs" id="tabs"></div>
</header>
<main id="main"></main>
<div class="modal" id="modal"><div class="box">
  <div class="row"><b id="clipTitle"></b><button class="plain" id="closeClip">Close</button></div>
  <video id="clipVideo" controls></video>
  <div class="row" style="margin-top:8px"><span class="small" id="clipInfo"></span><span><button class="plain" id="prevClip">◀ Prev</button> <button class="plain" id="nextClip">Next ▶</button></span></div>
</div></div>
<script>
const $ = s => document.querySelector(s);
const NS = "http://www.w3.org/2000/svg";
const el = (t, a = {}, p) => { const e = document.createElementNS(NS, t); for (const [k, v] of Object.entries(a)) e.setAttribute(k, v); if (p) p.appendChild(e); return e; };
const fmt = t => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, "0")}`;
const cap = s => s ? s[0].toUpperCase() + s.slice(1) : "";
let R, current, rallyById = {};

async function init() {
  const file = new URLSearchParams(location.search).get("report") || "boyer_devilliers";
  R = await (await fetch(`../outputs/reports/${file}.json`, {cache: "no-store"})).json();
  R.rallies.forEach(r => rallyById[r.id] = r);
  $("#title").textContent = `Match analysis · ${R.title}`;
  $("#source").textContent = `Based on ${R.source}. Small samples are marked.`;
  const names = Object.keys(R.players);
  $("#tabs").innerHTML = names.map((n, i) => `<button class="tab" data-p="${n}"><span class="dot" style="background:var(--series-${i + 1})"></span>${n}</button>`).join("");
  document.querySelectorAll(".tab").forEach(b => b.onclick = () => show(b.dataset.p));
  show(names[0]);
}

function clipButtons(ids) {
  if (!ids || !ids.length) return "";
  return `<span class="clips">${ids.slice(0, 8).map(id => `<button class="clip" data-r="${id}" data-set="${ids.join(",")}">▶ ${fmt(rallyById[id]?.start_t || 0)}</button>`).join("")}${ids.length > 8 ? `<span class="small">+${ids.length - 8}</span>` : ""}</span>`;
}

function tile(label, s, suffix = "") {
  const v = s.value == null ? "–" : s.value + suffix;
  return `<div class="tile"><div class="l">${label}</div><div class="v">${v}</div><div class="n">${s.n} ${s.n === 1 ? "rally" : "rallies"}${s.n < 5 ? " · small sample" : ""}</div></div>`;
}

function show(name) {
  current = name;
  document.querySelectorAll(".tab").forEach(b => b.classList.toggle("on", b.dataset.p === name));
  const P = R.players[name], idx = Object.keys(R.players).indexOf(name), col = `var(--series-${idx + 1})`;
  const s = P.summary;
  $("#main").innerHTML = `
    <section class="tiles">
      ${tile("Rallies won", s.rallies_won_pct, "%")}${tile("Won when serving", s.won_on_serve_pct, "%")}
      ${tile("Won when returning", s.won_on_return_pct, "%")}
      <div class="tile"><div class="l">Shots hit</div><div class="v">${s.shots.value}</div><div class="n">in ${s.rallies.value} rallies</div></div>
      <div class="tile"><div class="l">Avg distance from net</div><div class="v">${P.movement.avg_depth_ft ?? "–"}<span style="font-size:14px"> ft</span></div><div class="n">during rallies</div></div>
      <div class="tile"><div class="l">Time at kitchen line</div><div class="v">${P.movement.kitchen_time_pct ?? "–"}%</div><div class="n">within 9 ft of the net</div></div>
    </section>
    <section class="card"><h2>Strengths, weaknesses and patterns</h2><p class="why">Plain-language findings for this match. Click ▶ to watch the rallies behind each one.</p>
      <div class="ins">${P.insights.map(i => `<div><span class="badge ${i.kind}">${i.kind}</span><span>${i.text}${i.low_sample ? ` <span class="small">small sample (${i.n})</span>` : ""}</span>${clipButtons(i.rallies)}</div>`).join("") || '<span class="empty">Not enough data.</span>'}</div>
    </section>
    <section class="grid">
      <div class="card" style="grid-column: span 3"><h2>Win probability &amp; big points</h2><p class="why">Live chance of winning the match before each rally (side-out scoring model that learns each player's serve-rally win rate as the match goes; starts at about 50%). Dots = the most important rallies (where winning or losing the rally moved the match odds most, for equal players at that score); click to watch. "Big points" = the top quarter of rallies by importance.</p><div id="wp"></div></div>
    </section>
    <section class="grid">
      <div class="card"><h2>Forehand &amp; backhand: forced or chosen?</h2><p class="why">Each stroke split by the move before it: from where the player stood when the opponent hit, to the contact. Pulled wide = moved 3+ ft toward that side. Near the body = little movement (positioning or choice). Ran around = moved the other way first (e.g. a run-around forehand). Click a segment to watch.</p><div id="strokeWhy"></div></div>
      <div class="card" style="grid-column: span 2"><h2>Shot choice by position</h2><p class="why">What this player plays depending on where both players stand at contact (net = within 9 ft of the net, mid = 9-18 ft, back = deeper). Each box: number of shots, most played shots, direction and depth of the ball, and how often that rally was won. Click a box to watch. Shot types are automatic (about 2 in 3 right).</p><div id="situ"></div></div>
    </section>
    <section class="grid">
      <div class="card" style="grid-column: span 2"><h2>How they move after each opponent shot</h2><p class="why">Average position when the opponent hit (circle) and at their own contact (arrow head), on their own half with the net at the top. "Rushed" = less than 0.3 s to spare.</p><div style="display:flex;flex-wrap:wrap;gap:18px;align-items:flex-start"><svg id="moveSvg" style="width:100%;max-width:340px"></svg><div id="moveList" style="flex:1;min-width:240px"></div></div></div>
    </section>
    <section class="grid">
      <div class="card"><h2>Shot mix</h2><p class="why">All shots this player hit, by type.</p><div id="mix"></div></div>
      <div class="card"><h2>Forehand vs backhand</h2><p class="why">Overall, and per shot type.</p><div id="strokes"></div></div>
      <div class="card"><h2>Third shot (when serving)</h2><p class="why">Choice, how often that rally was won, and its quality: median pace, share crossing under 1.5 ft above the net, share landing deep (15+ ft past the net), share where the opponent&#39;s reply was rushed.</p><div id="third"></div></div>
    </section>
    <section class="grid">
      <div class="card" style="grid-column: span 2"><h2>Ball speed</h2><p class="why">Speed off the paddle, measured from flight time and distance and cross-checked with the 3D flight path (typical error ±3–4 mph). Only shots with a trustworthy speed are counted.</p><div id="speed"></div></div>
      <div class="card"><h2>Fastest shots</h2><p class="why">Click ▶ to watch.</p><div id="fastest"></div></div>
    </section>
    <section class="grid">
      <div class="card" style="grid-column: span 3"><h2>Shot placement</h2><p class="why">Where this player's shots landed on the other side (net at the top, seen from the hitter). Dots = landing spots; click a dot to watch. "Deep" = past the kitchen, in the back 15 ft. In/out calls are not reliable yet, so they are not shown.</p><div id="placement" style="display:flex;flex-wrap:wrap;gap:18px"></div></div>
    </section>
    <section class="grid">
      <div class="card" style="grid-column: span 3"><h2>Movement</h2><p class="why">How much and how fast this player moved during rallies (feet positions, smoothed over 0.5 s; top speeds must be held for 0.5 s).</p><div id="running"></div></div>
    </section>
    <section class="grid">
      <div class="card" style="grid-column: span 3"><h2>Time pressure</h2><p class="why">Time to spare on each shot: the time since the opponent's hit, minus 0.25 s to react and the time needed to cover the distance actually moved (at 12 ft/s). Under 0.3 s = rushed. Method after Mlakar &amp; Kovalchik (2020, tennis). An "error" = the shot was the last of a rally this player lost. Click ▶ to watch the rushed rallies.</p><div id="pressure"></div></div>
    </section>
    <section class="grid">
      <div class="card"><h2>Where they hit from</h2><p class="why">Contact points on their own half (net at top). Pick a shot type to see where they play it from.</p><div id="contactChips" class="chips"></div><svg id="contacts" style="width:100%;max-width:340px"></svg></div>
      <div class="card"><h2>Court coverage</h2><p class="why">Where they stood during rallies (brighter = more time).</p><svg id="heat" style="width:100%;max-width:340px"></svg></div>
      <div class="card"><h2>How rallies ended</h2><p class="why">When this player hit the last shot: won it (winner / forced error) or lost it (own error).</p><div id="endings"></div>
        <h2 style="margin-top:14px">By rally length</h2><div id="length"></div></div>
    </section>
    <section class="card"><h2>Rallies</h2><p class="why">Every rally in the analysis. Click to watch.</p><div id="rallies"></div></section>`;
  renderMix(P, col); renderStrokes(P, col); renderThird(P, col); renderContacts(P, col); renderHeat(P); renderEndings(P, col); renderLength(P, col); renderWP(P, name, col); renderTactics(P, col); renderRallies(name); addTakeaways(P, name); addAccuracy();
  document.querySelectorAll(".clip").forEach(b => b.onclick = () => openClip(+b.dataset.r, b.dataset.set.split(",").map(Number)));
}

function bars(target, entries, col, max) {
  max = max || Math.max(1, ...entries.map(e => e[1]));
  $(target).innerHTML = entries.length ? entries.map(([k, v, extra]) => `<div class="bar"><span>${cap(k)}</span><div class="track"><div class="fill" style="width:${100 * v / max}%;background:${col}"></div></div><span style="text-align:right">${v}${extra || ""}</span></div>`).join("") : '<span class="empty">No data.</span>';
}
function renderMix(P, col) { bars("#mix", Object.entries(P.shot_mix), col); }
function renderStrokes(P, col) {
  const fh = P.stroke.forehand || 0, bh = P.stroke.backhand || 0, t = fh + bh || 1;
  let h = `<div class="split"><div style="width:${100 * fh / t}%;background:${col}"></div><div style="width:${100 * bh / t}%;background:var(--border)"></div></div>
    <div class="small" style="color:var(--text-secondary)">Forehand ${fh} (${Math.round(100 * fh / t)}%) · Backhand ${bh} (${Math.round(100 * bh / t)}%)</div>
    <table style="margin-top:10px"><tr><th>Shot</th><th>Forehand</th><th>Backhand</th></tr>`;
  for (const [k, v] of Object.entries(P.stroke_by_shot)) h += `<tr><td>${cap(k)}</td><td>${v.forehand || 0}</td><td>${v.backhand || 0}</td></tr>`;
  $("#strokes").innerHTML = h + "</table>";
}
function thirdQ(v) {
  const q = [];
  if (v.mph != null) q.push(`${v.mph} mph`);
  if (v.low_pct != null) q.push(`${v.low_pct}% low over net`);
  if (v.deep_pct != null) q.push(`${v.deep_pct}% deep`);
  if (v.rushed_next_pct != null) q.push(`rushed the reply ${v.rushed_next_pct}%`);
  return q.length ? " · " + q.join(" · ") : "";
}
function renderThird(P, col) {
  const e = Object.entries(P.third_shot);
  $("#third").innerHTML = e.length ? e.map(([k, v]) => `<div class="bar"><span>${cap(k)}</span><div class="track"><div class="fill" style="width:${v.won_pct ?? 0}%;background:${col}"></div></div><span style="text-align:right">${v.won_pct ?? "–"}%</span></div><div class="small" style="color:var(--text-muted);margin:-2px 0 6px 128px">${v.count}×${thirdQ(v)} ${clipButtons(v.rallies)}</div>`).join("") : '<span class="empty">No tagged third shots for this player.</span>';
}
// own half: x 0..20 (from their right), depth 0 (net) .. 22 (baseline), plus 12 ft behind and 6 ft wide
const S = 10, OX = 60, OY = 20;
const hx = x => OX + x * S, hy = d => OY + d * S;
function halfCourt(svg) {
  svg.setAttribute("viewBox", `0 0 ${32 * S} ${36 * S}`); svg.innerHTML = "";
  el("rect", {x: 0, y: 0, width: 32 * S, height: 36 * S, fill: "var(--court-out)", rx: 8}, svg);
  el("rect", {x: hx(0), y: hy(0), width: 20 * S, height: 22 * S, fill: "var(--court)"}, svg);
  el("rect", {x: hx(0), y: hy(0), width: 20 * S, height: 7 * S, fill: "var(--court-kitchen)"}, svg);
  const L = (a, b, c, d, w = 2) => el("line", {x1: hx(a), y1: hy(b), x2: hx(c), y2: hy(d), stroke: "var(--court-line)", "stroke-width": w}, svg);
  L(0, 0, 0, 22); L(20, 0, 20, 22); L(0, 22, 20, 22); L(0, 7, 20, 7); L(10, 7, 10, 22);
  L(-1.5, 0, 21.5, 0, 4);
  const t = el("text", {x: hx(10), y: hy(-0.6), "text-anchor": "middle", style: "fill:var(--court-line)"}, svg); t.textContent = "net";
  return svg;
}
const GROUP = {"serve": "Serve", "return": "Return", "drive": "Drive", "third-shot drive": "Drive", "groundstroke": "Groundstroke",
  "third-shot groundstroke": "Groundstroke", "volley": "Volley", "drop": "Drop / dink / reset", "third-shot drop": "Drop / dink / reset",
  "dink": "Drop / dink / reset", "reset": "Drop / dink / reset", "lob": "Lob", "overhead": "Overhead"};
function renderContacts(P, col, pick = "All") {
  const mine = R.rallies.flatMap(r => r.shots.filter(s => s.player === current && s.pos).map(s => ({...s, g: GROUP[s.shot] || "Other"})));
  const counts = {}; mine.forEach(s => counts[s.g] = (counts[s.g] || 0) + 1);
  $("#contactChips").innerHTML = ["All", ...Object.keys(counts).sort((a, b) => counts[b] - counts[a])].map(g =>
    `<button class="chip${g === pick ? " on" : ""}" data-g="${g}">${g} <span>${g === "All" ? mine.length : counts[g]}</span></button>`).join("");
  document.querySelectorAll("#contactChips .chip").forEach(b => b.onclick = () => renderContacts(P, col, b.dataset.g));
  const svg = halfCourt($("#contacts"));
  const own = ([x, y]) => y >= 22 ? [20 - x, y - 22] : [x, 22 - y];
  mine.filter(s => pick === "All" || s.g === pick).forEach(s => { const [x, d] = own(s.pos);
    el("circle", {cx: hx(x), cy: hy(d), r: 6, fill: "var(--ball)", stroke: "var(--paddle)", "stroke-width": 1, opacity: .95}, svg); });
}
function renderHeat(P) {
  const svg = halfCourt($("#heat"));
  const g = P.movement.heatmap.grid, c = P.movement.heatmap.cell_ft, max = Math.max(1, ...g.flat());
  g.forEach((row, i) => row.forEach((v, j) => {
    if (!v) return;
    el("rect", {x: hx(-6 + j * c) + 1, y: hy(i * c) + 1, width: c * S - 2, height: c * S - 2, rx: 2,
      fill: `var(--seq-${Math.min(6, 1 + Math.floor(6 * v / max))})`, opacity: .9}, svg);
  }));
}
function renderEndings(P, col) {
  const f = Object.entries(P.finishing_shots), e = Object.entries(P.error_shots);
  const rows = [...f.map(([k, v]) => ["Won with", k, v, "var(--good)"]), ...e.map(([k, v]) => ["Lost on own", k, v, "var(--bad)"])];
  const sp = P.speed || { groups: {}, fastest: [] };
  const sg = Object.entries(sp.groups);
  $("#speed").innerHTML = sg.length ? `<table><tr><th>Shot</th><th>Typical</th><th>Top</th><th>Shots</th><th></th></tr>${sg.map(([k, v]) => `<tr><td>${k}</td><td><b>${v.avg}</b> mph</td><td>${v.max ?? "–"}${v.max ? " mph" : ""}</td><td>${v.n}</td><td>${clipButtons(v.rallies)}</td></tr>`).join("")}</table>` : '<span class="empty">No measured speeds.</span>';
  $("#fastest").innerHTML = sp.fastest.length ? `<table>${sp.fastest.map(f => `<tr><td><b>${f.mph}</b> mph${f.err ? ` <span class="small">±${f.err}</span>` : ""}</td><td>${cap(f.shot || "shot")}</td><td>${clipButtons([f.rally])}</td></tr>`).join("")}</table>` : '<span class="empty">–</span>';
  const pl = P.placement || {};
  const half = (label, g) => {
    const W = 160, Hh = 176, sx = W / 26, sy = Hh / 28, ox = 3 * sx, oy = 2 * sy;   // 20x22 ft half + margins
    const X = x => ox + x * sx, Y = d => oy + d * sy;
    const dots = g.points.map(([x, d, rid]) => `<circle cx="${X(x)}" cy="${Y(d)}" r="4" fill="var(--ball)" fill-opacity="0.95" stroke="var(--paddle)" stroke-width="0.8" style="cursor:pointer" data-r="${rid}"><title>${label}: rally ${rid}</title></circle>`).join("");
    return `<div><div style="font-size:13px;margin-bottom:4px"><b>${label}</b> <span class="small" style="color:var(--text-muted)">${g.n} shots · ${g.deep_pct}% deep</span></div>
      <svg width="${W}" height="${Hh}" viewBox="0 0 ${W} ${Hh}" class="placement">
        <rect x="${X(0)}" y="${Y(0)}" width="${20 * sx}" height="${22 * sy}" fill="none" stroke="var(--text-muted)" />
        <line x1="${X(0)}" y1="${Y(7)}" x2="${X(20)}" y2="${Y(7)}" stroke="var(--text-muted)" stroke-dasharray="3 3"/>
        <line x1="${X(10)}" y1="${Y(7)}" x2="${X(10)}" y2="${Y(22)}" stroke="var(--text-muted)"/>
        <line x1="${X(-2)}" y1="${Y(0)}" x2="${X(22)}" y2="${Y(0)}" stroke="var(--text-primary)" stroke-width="2"/>
        ${dots}</svg></div>`;
  };
  $("#placement").innerHTML = Object.keys(pl).length ? Object.entries(pl).map(([k, g]) => half(k, g)).join("") : '<span class="empty">No landing spots.</span>';
  document.querySelectorAll("svg.placement circle").forEach(c => c.onclick = () => openClip(+c.dataset.r, [+c.dataset.r]));
  const rn = P.running || {};
  $("#running").innerHTML = rn.rallies ? `<div class="tiles" style="margin:0">
      <div class="tile"><div class="l">Distance per rally</div><div class="v">${rn.dist_per_rally_ft}<span style="font-size:14px"> ft</span></div><div class="n">${rn.total_dist_ft} ft in ${rn.rallies} rallies</div></div>
      <div class="tile"><div class="l">Typical top speed</div><div class="v">${rn.typical_peak_mph}<span style="font-size:14px"> mph</span></div><div class="n">per rally (median)</div></div>
      <div class="tile"><div class="l">Fastest sprint</div><div class="v">${rn.top_sprint_mph}<span style="font-size:14px"> mph</span></div><div class="n">${clipButtons(rn.top_sprints.map(x => x.rally))}</div></div>
      <div class="tile"><div class="l">Time sprinting</div><div class="v">${rn.sprint_time_pct}%</div><div class="n">of rally time above 6 mph</div></div>
      ${P.net && P.net.rallies ? `<div class="tile"><div class="l">Gets to the net</div><div class="v">${P.net.reached_pct}%</div><div class="n">of ${P.net.rallies} rallies · ${P.net.median_arrival_s ?? "–"} s after the serve (median)</div></div>
      <div class="tile"><div class="l">First to the net</div><div class="v">${P.net.first_pct ?? "–"}%</div><div class="n">of ${P.net.n_contested} rallies where someone got there · won ${P.net.won_when_first_pct ?? "–"}% when first, ${P.net.won_when_opp_first_pct ?? "–"}% when the opponent was ${clipButtons(P.net.first_rallies)}</div></div>` : ""}
      <div class="tile"><div class="l">Movement per shot</div><div class="v">${rn.ft_per_shot ?? "–"}<span style="font-size:14px"> ft</span></div><div class="n">${rn.ft_per_min ?? "–"} ft per minute of rally</div></div>
    </div>` : '<span class="empty">No movement data.</span>';
  const pr = P.pressure || {}, fc = pr.faced || {}, ap = pr.applied || {};
  const pc = v => v == null ? "–" : v + "%";
  $("#pressure").innerHTML = fc.n ? `<div class="tiles" style="margin:0">
      <div class="tile"><div class="l">Rushed on</div><div class="v">${pc(fc.rushed_pct)}</div><div class="n">of ${fc.n} shots · median ${fc.median_spare_s} s to spare ${clipButtons(fc.rushed_rallies.slice(0, 6))}</div></div>
      <div class="tile"><div class="l">Errors when rushed</div><div class="v">${pc(fc.error_when_rushed_pct)}</div><div class="n">vs ${pc(fc.error_otherwise_pct)} otherwise (${fc.n_rushed} rushed${fc.n_rushed < 10 ? ", small sample" : ""})</div></div>
      <div class="tile"><div class="l">Rushes the opponent</div><div class="v">${pc(ap.rushed_opponent_pct)}</div><div class="n">of ${ap.n} shots · opponent errs ${pc(ap.opponent_error_when_rushed_pct)} of those ${clipButtons((ap.rushed_rallies || []).slice(0, 6))}</div></div>
    </div>
    ${Object.keys(ap.by_shot || {}).length ? `<h2 style="margin-top:14px">Which shots rush the opponent</h2>` + Object.entries(ap.by_shot).map(([k, v]) => `<div class="bar"><span>${k}</span><div class="track"><div class="fill" style="width:${v.rushed_pct}%;background:${col}"></div></div><span style="text-align:right">${v.rushed_pct}% of ${v.n}</span></div>`).join("") : ""}` : '<span class="empty">No pressure data.</span>';
  $("#endings").innerHTML = rows.length ? `<table><tr><th></th><th>Last shot</th><th>Count</th><th></th></tr>${rows.map(([a, k, v, c]) => `<tr><td style="color:${c}">${a}</td><td>${k}</td><td>${v.count}</td><td>${clipButtons(v.rallies)}</td></tr>`).join("")}</table>` : '<span class="empty">No rallies with a known winner where this player hit last.</span>';
}
function renderWP(P, name, col) {
  const info = R.win_probability || {}, me = info.player === name;
  const rs = R.rallies.filter(r => r.wp_before != null);
  if (!rs.length) { $("#wp").innerHTML = '<span class="empty">No score data.</span>'; return; }
  const val = r => 100 * (me ? r.wp_before : 1 - r.wp_before);
  const W = 720, H = 190, L = 34, Rm = 10, T = 10, B = 24;
  const X = i => L + (W - L - Rm) * i / Math.max(1, rs.length - 1), Y = v => T + (H - T - B) * (1 - v / 100);
  const top = new Set([...rs].sort((a, b) => b.importance - a.importance).slice(0, 6).map(r => r.id));
  let g = "";
  rs.forEach((r, i) => { if (i && r.game !== rs[i - 1].game) g += `<line x1="${X(i - 0.5)}" y1="${T}" x2="${X(i - 0.5)}" y2="${H - B}" stroke="var(--text-muted)" stroke-dasharray="2 4"/><text x="${X(i - 0.5) + 4}" y="${T + 10}" font-size="11" fill="var(--text-muted)">Game ${r.game}</text>`; });
  const path = rs.map((r, i) => `${i ? "L" : "M"}${X(i).toFixed(1)},${Y(val(r)).toFixed(1)}`).join("");
  const dots = rs.map((r, i) => top.has(r.id) ? `<circle cx="${X(i)}" cy="${Y(val(r))}" r="5" fill="${col}" stroke="var(--surface)" stroke-width="2" data-r="${r.id}" style="cursor:pointer"><title>Rally ${r.id} · game ${r.game} · ${r.score_before} (${r.server} serving) · winner ${r.winner || "?"}</title></circle>` : "").join("");
  const yt = [0, 50, 100].map(v => `<text x="${L - 6}" y="${Y(v) + 4}" font-size="11" text-anchor="end" fill="var(--text-muted)">${v}%</text>`).join("");
  const bp = P.big_points || {};
  $("#wp").innerHTML = `<svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:${W}px" id="wpsvg">
      <line x1="${L}" y1="${Y(50)}" x2="${W - Rm}" y2="${Y(50)}" stroke="var(--text-muted)" stroke-dasharray="3 3"/>${yt}${g}
      <path d="${path}" fill="none" stroke="${col}" stroke-width="2"/>${dots}
      <text x="${L}" y="${H - 6}" font-size="11" fill="var(--text-muted)">rallies in order →</text></svg>
    ${bp.n_big ? `<div class="tiles" style="margin-top:10px">
      <div class="tile"><div class="l">Big points won</div><div class="v">${bp.big_won_pct}%</div><div class="n">of ${bp.n_big} most important rallies${bp.n_big < 10 ? " · small sample" : ""} ${clipButtons(bp.big_rallies)}</div></div>
      <div class="tile"><div class="l">Other rallies won</div><div class="v">${bp.rest_won_pct}%</div><div class="n">of ${bp.n_rest}</div></div></div>` : ""}`;
  document.querySelectorAll("#wpsvg circle[data-r]").forEach(c => c.onclick = () => openClip(+c.dataset.r, [...top]));
}
function renderTactics(P, col) {
  const T = P.tactics || {}, tk = T.takeaways || {};
  // strokes
  const seg = {pulled_wide: ["Pulled wide", "var(--paddle)"], near_body: ["Near the body", "var(--series-1)"], ran_around: ["Ran around", "var(--series-2)"]};
  const st = T.strokes || {};
  $("#strokeWhy").innerHTML = (tk.strokes ? `<p class="take">${tk.strokes}</p>` : "") + ["forehand", "backhand"].map(k => {
    const c = st[k] || {}, n = Object.values(c).reduce((a, b) => a + b, 0);
    if (!n) return "";
    return `<div style="margin:10px 0 4px;font-size:13px"><b>${cap(k)}</b> <span class="muted-n">${n} shots</span></div><div class="split" style="height:22px">` +
      Object.entries(seg).filter(([s]) => c[s]).map(([s, [lab, colr]]) => `<div class="seg" data-k="${k}:${s}" title="${lab}: ${c[s]}" style="flex:${c[s]};background:${colr};cursor:pointer;color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center">${Math.round(100 * c[s] / n)}%</div>`).join("") + `</div>`;
  }).join("") + `<div class="legend-row">${Object.values(seg).map(([l, c]) => `<span><span class="dot" style="background:${c}"></span>${l}</span>`).join("")}</div>`;
  document.querySelectorAll("#strokeWhy .seg").forEach(d => d.onclick = () => { const ids = (T.stroke_rallies || {})[d.dataset.k] || []; if (ids.length) openClip(ids[0], ids); });
  // situations: rows = me (net at top), cols = opponent
  const Z = ["net", "mid", "back"], lab = {net: "Net", mid: "Mid-court", back: "Back"};
  const by = {}; (T.situations || []).forEach(x => by[x.me + "|" + x.opp] = x);
  const maxN = Math.max(1, ...(T.situations || []).map(x => x.n));
  let g = `<div class="situ-grid"><div></div>${Z.map(z => `<div class="situ-h">Opponent at<br><b>${lab[z]}</b></div>`).join("")}`;
  Z.forEach(me => {
    g += `<div class="situ-h situ-row">They are at<br><b>${lab[me]}</b></div>`;
    Z.forEach(op => {
      const x = by[me + "|" + op];
      if (!x) { g += `<div class="situ-cell empty-cell">–</div>`; return; }
      const a = 0.08 + 0.32 * x.n / maxN;
      g += `<div class="situ-cell" data-k="${me}|${op}" style="background:rgba(46,107,69,${a.toFixed(2)})">
        <div class="situ-n">${x.n} shots${x.n < 5 ? " · small" : ""}</div>
        ${x.shots.slice(0, 2).map(([k, n]) => `<div class="situ-shot"><b>${Math.round(100 * n / x.n)}%</b> ${k}</div>`).join("")}
        <div class="situ-meta">${x.cross_pct != null ? x.cross_pct + "% cross-court" : ""}${x.deep_pct != null ? " · " + x.deep_pct + "% deep" : ""}${x.short_pct ? " · " + x.short_pct + "% short" : ""}</div>
        <div class="situ-won">won ${x.won_pct}%</div></div>`;
    });
  });
  $("#situ").innerHTML = (tk.situations ? `<p class="take">${tk.situations}</p>` : "") + g + `</div>`;
  document.querySelectorAll("#situ .situ-cell[data-k]").forEach(c => c.onclick = () => { const ids = by[c.dataset.k].rallies; openClip(ids[0], ids); });
  // response arrows
  const svg = halfCourt($("#moveSvg")), rs = Object.entries(T.response || {}).filter(([, v]) => v.n >= 4);
  if (!svg.querySelector("defs")) { const d = el("defs", {}, svg); const m = el("marker", {id: "ah", viewBox: "0 0 10 10", refX: 8, refY: 5, markerWidth: 5, markerHeight: 5, orient: "auto-start-reverse"}, d); el("path", {d: "M0,0 L10,5 L0,10 z", fill: "var(--ball)"}, m); }
  rs.forEach(([k, v], i) => {
    el("circle", {cx: hx(v.from[0]), cy: hy(v.from[1]), r: 4, fill: "#fff", opacity: .9}, svg);
    el("line", {x1: hx(v.from[0]), y1: hy(v.from[1]), x2: hx(v.to[0]), y2: hy(v.to[1]), stroke: "var(--ball)", "stroke-width": 3, "marker-end": "url(#ah)"}, svg);
    el("circle", {cx: hx(v.to[0]) + 10, cy: hy(v.to[1]) - 10, r: 8, fill: "var(--paddle)", stroke: "#fff", "stroke-width": 1}, svg);
    const t = el("text", {x: hx(v.to[0]) + 10, y: hy(v.to[1]) - 6, "text-anchor": "middle", style: "fill:#fff;font-size:10.5px;font-weight:700"}, svg); t.textContent = i + 1;
  });
  $("#moveList").innerHTML = (tk.response ? `<p class="take">${tk.response}</p>` : "") + (rs.length ? `<table><tr><th>Opponent's shot</th><th>Shots</th><th>Moved</th><th>Rushed</th><th></th></tr>` +
    rs.map(([k, v], i) => `<tr><td><span class="num">${i + 1}</span>${k}</td><td>${v.n}</td><td>${v.moved_ft} ft</td><td>${v.rushed_pct ?? "–"}%</td><td>${clipButtons(v.rallies.slice(0, 4))}</td></tr>`).join("") + `</table>` : '<span class="empty">No movement data.</span>');
}

// one bold takeaway line per card, written from that card's numbers
function addTakeaways(P, name) {
  const put = (sel, text) => { const box = $(sel)?.closest(".card"); if (!box || !text) return;
    const h = box.querySelector("h2"); const p = document.createElement("p"); p.className = "take"; p.innerHTML = text; h.after(p); };
  const opp = Object.keys(R.players).find(n => n !== name), O = R.players[opp] || {};
  const mix = Object.entries(P.shot_mix || {}), tot = mix.reduce((a, [, v]) => a + v, 0);
  if (tot) put("#mix", "Mostly " + mix.slice(0, 3).map(([k, v]) => `${k}s (${Math.round(100 * v / tot)}%)`).join(", ") + ".");
  const st = P.stroke || {}, ns = (st.forehand || 0) + (st.backhand || 0);
  if (ns) put("#strokes", `Backhand on ${Math.round(100 * (st.backhand || 0) / ns)}% of shots - see "forced or chosen?" below for why.`);
  const th = Object.entries(P.third_shot || {}).filter(([, v]) => v.count >= 3).sort((a, b) => b[1].count - a[1].count);
  if (th.length) put("#third", `Third ball: ${th.map(([k, v]) => `${k.replace("third-shot ", "")} ${v.count}x, won ${v.won_pct}%`).join("; ")}.`);
  const sg = (P.speed || {}).groups || {};
  if (sg.Drive) put("#speed", `Drives average ${sg.Drive.avg} mph` + ((O.speed || {}).groups?.Drive ? ` (${opp}: ${O.speed.groups.Drive.avg} mph)` : "") + (sg.Serve ? `; serves ${sg.Serve.avg} mph.` : "."));
  const pl = P.placement || {};
  const deep = Object.entries(pl).filter(([, g]) => g.n >= 5).map(([k, g]) => `${k.toLowerCase()} ${g.deep_pct}%`);
  if (deep.length) put("#placement", `Lands deep (back 15 ft): ${deep.join(", ")}.`);
  const rn = P.running || {}, nt = P.net || {};
  if (rn.rallies) put("#running", `Runs ${rn.dist_per_rally_ft} ft per rally (${opp}: ${(O.running || {}).dist_per_rally_ft ?? "–"} ft); gets to the net in ${nt.reached_pct ?? "–"}% of rallies.`);
  const fc = (P.pressure || {}).faced || {}, ofc = (O.pressure || {}).faced || {};
  if (fc.n) put("#pressure", `Rushed on ${fc.rushed_pct}% of shots vs ${ofc.rushed_pct ?? "–"}% for ${opp}` + (fc.rushed_pct > (ofc.rushed_pct ?? 100) ? " - the opponent dictates the pace." : " - they dictate the pace."));
  const bp = P.big_points || {};
  if (bp.n_big) put("#wp", `Won ${bp.big_won_pct}% of the ${bp.n_big} most important rallies vs ${bp.rest_won_pct}% of the rest` + (Math.abs(bp.big_won_pct - bp.rest_won_pct) < 15 ? " - no real difference." : " (not yet conclusive on one match)."));
  const mv = P.movement || {};
  if (mv.avg_depth_ft != null) put("#heat", `Plays on average ${mv.avg_depth_ft} ft from the net; at the kitchen line ${mv.kitchen_time_pct}% of rally time.`);
  const er = Object.entries(P.error_shots || {})[0], fi = Object.entries(P.finishing_shots || {})[0];
  if (er || fi) put("#endings", [fi ? `Wins most often with a ${fi[0]} (${fi[1].count}x)` : "", er ? `loses most often on a ${er[0]} (${er[1].count}x)` : ""].filter(Boolean).join("; ") + ".");
}
// Accuracy note under every metric. Numbers come from our validation runs (PROGRESS.md / docs/DESIGN.md):
// analyst tags, referee point list (Las Vegas), broadcast scoreboard (US Open) and game-rule checks.
// Update these when a model is retrained or re-validated.
const ACC = {
  tiles: "Rally winner from tracking + game rules: 96% right vs the referee's list (Las Vegas), 52 of 53 vs the scoreboard (US Open). Server 98%. Rallies found: 48 of 53 points (Las Vegas); broadcast replays are removed.",
  ins: "Each finding shows how many rallies it rests on. It is only called a strength or weakness when the difference is unlikely to be chance (Fisher test, p < 0.1); otherwise it stays a pattern.",
  wp: "A model, not a measurement: it uses the reconstructed score, so it inherits the server (98%) and winner (96%) accuracy. One misread server shifts the score by a point or two (US Open game 2 runs about 2 points ahead of the scoreboard).",
  strokeWhy: "Forehand / backhand side: 95% right (74 of 78 tagged shots). Forced vs chosen is an estimate from foot movement (positions about ±1 ft): a long stretch without a step counts as near the body.",
  situ: "Positions about ±1 ft, so zone borders blur by that much. Shot types: serves and returns nearly always right, but only about 57% of rally shots (28 of 49 tagged); drops, resets and dinks are the most often confused. Being replaced by a learned model. Direction and depth come from landing spots (about ±1.5 ft).",
  moveList: "Positions about ±1 ft, 10 times a second, smoothed over 0.5 s; arrows are averages. Hit timing is exact to one video frame (0.03 s), so 'rushed' is reliable to that level.",
  mix: "Shot types: 76 of 102 tagged shots right overall, but serves and returns carry that - rally shots only about 57% (28 of 49); drops, resets and dinks are often called volleys or groundstrokes. Being replaced by a learned model. Hits found: 86-94%.",
  strokes: "Forehand / backhand: 95% right (74 of 78 tagged shots).",
  third: "Third-shot type about 57% right (rally shots, 49 tagged), so treat drive vs drop splits as rough; rally winner 96%. Pace ±3-4 mph; net clearance from the 3D ball path; landing depth about ±1.5 ft.",
  speed: "Typical error ±3-4 mph. Only shots where two independent measurements (flight time and 3D path) agree within 20% are used; top speeds only when they agree closely.",
  fastest: "Typical error ±3-4 mph; the ± after each speed is that shot's own uncertainty.",
  placement: "Landing spots from the 3D ball path: returned serves land in the service box 93-95% of the time (they must), so spots are good to about 1-1.5 ft. Calls within that distance of a line are not reliable.",
  running: "Player positions about ±1 ft after the far-end depth fix (checked with the kitchen rule: volleys measured inside the kitchen fell from 46% to 4%). Distances are not checked against GPS - compare the two players in the same match rather than across venues.",
  pressure: "Built from hit timing (exact to 0.03 s) and positions (±1 ft). Checked as a whole: rushed shots end as the hitter's error 22% of the time vs 15% otherwise. 'Error' = last detected shot of a lost rally; about 1 in 10 final shots is missed.",
  contacts: "Hitter position at contact about ±1 ft; 86-94% of hits are found.",
  heat: "Positions about ±1 ft, sampled 10 times a second during rallies.",
  endings: "Uses the last detected hit and the rally winner (96%). About 1 in 10 final shots is missed; then the shot before it is credited. Rally length counts detected hits (86-94% found), so a rally can show one shot fewer than it had.",
  rallies: "Rallies found from tracking; replays removed by spotting repeated player movement.",
};
function addAccuracy() {
  const note = t => `<p class="acc"><b>Accuracy</b> · ${t}</p>`;
  for (const [id, t] of Object.entries(ACC)) {
    if (id === "tiles") { const sec = document.querySelector("#main section.tiles"); if (sec) sec.insertAdjacentHTML("afterend", note(t)); continue; }
    if (id === "ins") { const box = document.querySelector("#main .ins")?.closest(".card"); if (box) box.insertAdjacentHTML("beforeend", note(t)); continue; }
    const box = $("#" + id)?.closest(".card");
    if (box && !box.querySelector(`.acc[data-k="${id}"]`)) box.insertAdjacentHTML("beforeend", note(t).replace('<p class="acc"', `<p class="acc" data-k="${id}"`));
  }
}
function renderLength(P, col) {
  $("#length").innerHTML = Object.entries(P.rally_length).map(([k, v]) => `<div class="bar"><span>${k}</span><div class="track"><div class="fill" style="width:${v.value ?? 0}%;background:${col}"></div></div><span style="text-align:right">${v.value ?? "–"}%</span></div><div class="small" style="color:var(--text-muted);margin:-2px 0 6px 128px">won of ${v.n} ${clipButtons(v.rallies)}</div>`).join("");
}
function renderRallies(name) {
  $("#rallies").innerHTML = `<table><tr><th>Time</th><th>Server</th><th>Shots</th><th>Sequence</th><th>Won by</th><th></th></tr>${R.rallies.map(r => `
    <tr><td>${fmt(r.start_t)}</td><td>${r.server}</td><td>${r.n_shots}</td>
    <td style="font-size:12px">${r.shots.map(s => `<span style="color:${s.player === name ? "var(--text-primary)" : "var(--text-muted)"}">${s.shot || "hit"}${s.stroke ? (s.stroke === "forehand" ? " FH" : " BH") : ""}</span>`).join(" → ")}</td>
    <td>${r.winner ? `<b style="color:${r.winner === name ? "var(--good)" : "var(--bad)"}">${r.winner}</b>` : '<span class="small">not tagged</span>'}</td>
    <td>${clipButtons([r.id])}</td></tr>`).join("")}</table>`;
}

// ---- clip player ----
let clipSet = [], clipIdx = 0;
function openClip(id, set) {
  clipSet = set; clipIdx = Math.max(0, set.indexOf(id));
  playClip(); $("#modal").classList.add("on");
}
function playClip() {
  const r = rallyById[clipSet[clipIdx]], v = $("#clipVideo");
  $("#clipTitle").textContent = `Rally at ${fmt(r.start_t)} · ${r.n_shots} shots${r.winner ? " · won by " + r.winner : ""}`;
  $("#clipInfo").textContent = `${clipIdx + 1} of ${clipSet.length}`;
  if (!v.src.endsWith(R.video)) v.src = "../" + R.video;
  const go = () => { v.currentTime = Math.max(0, r.start_t - 1); v.play(); };
  v.readyState ? go() : v.addEventListener("loadedmetadata", go, {once: true});
  v.ontimeupdate = () => { if (v.currentTime > r.end_t + 1.5) v.pause(); };
}
$("#closeClip").onclick = () => { $("#modal").classList.remove("on"); $("#clipVideo").pause(); };
$("#prevClip").onclick = () => { clipIdx = (clipIdx - 1 + clipSet.length) % clipSet.length; playClip(); };
$("#nextClip").onclick = () => { clipIdx = (clipIdx + 1) % clipSet.length; playClip(); };
$("#modal").onclick = e => { if (e.target.id === "modal") $("#closeClip").click(); };
init();
</script>
