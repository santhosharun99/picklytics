<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><link rel="icon" href="brand/picklytics-mark.png">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Match analysis · Picklytics</title>
<link rel="stylesheet" href="theme.css?v=7">
</head>
<body>
<div class="wrap"><p class="loading">Opening the match workspace…</p></div>
<script>
// The per-player match page moved into the match workspace (hub.html, 2026-10-09). Old links
// (match.html?report=<report>) are forwarded to Placement & speed of the same match.
(async () => {
  const q = new URLSearchParams(location.search), report = q.get("report") || "boyer_devilliers_full";
  try {
    const J = await (await fetch("matches.json", { cache: "no-store" })).json();
    const m = J.matches.find(x => x.report === report);
    if (m) { location.replace(`hub.html?m=${encodeURIComponent(m.id)}&sec=placement`); return; }
  } catch (e) { /* fall through */ }
  document.querySelector(".wrap").innerHTML = `<div class="state-empty">No match uses the report “${report.replace(/[<>&"]/g, "")}”. <a href="matches.html">All matches</a></div>`;
})();
</script>
</body>
</html>
